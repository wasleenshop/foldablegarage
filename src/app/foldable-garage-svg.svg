<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="100%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="arch-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
      <path d="M 40 0 L 40 80 M 0 40 L 80 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" />
    </pattern>

    <!-- Luxury Polycarbonate/Glass Gradient -->
    <linearGradient id="panel-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15" />
    </linearGradient>

    <!-- Base Metallic Edge Gradient -->
    <linearGradient id="metal-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- NEW: Animated Passing Laser Gradient 1 (Cyan) -->
    <linearGradient id="passing-laser-1" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
      <!-- This animates the gradient moving from top to bottom -->
      <animateTransform attributeName="gradientTransform" type="translate" values="0,-1; 0,1.5" dur="4s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- NEW: Animated Passing Laser Gradient 2 (Blue) -->
    <linearGradient id="passing-laser-2" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
      <animateTransform attributeName="gradientTransform" type="translate" values="0,-1.5; 0,1" dur="5s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- NEW: Animated Passing Laser Gradient 3 (Violet) -->
    <linearGradient id="passing-laser-3" x1="0%" y1="0%" x2="0%" y2="100%" gradientUnits="objectBoundingBox">
      <animateTransform attributeName="gradientTransform" type="translate" values="0,-1; 0,1.5" dur="6s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Deep Architectural Background -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- 2. Animated Precision Grid (Slow Pan) -->
  <g opacity="0.8">
    <rect width="200%" height="200%" fill="url(#arch-grid)" transform="translate(-100, -100)">
      <animateTransform attributeName="transform" type="translate" values="-80,-80; 0,0; -80,-80" dur="20s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 3. The Retractable Mechanism (Sliding Isometric Panels) -->
  <g transform="skewX(-35) scale(1.2) translate(600, -200)">
    
    <!-- Base Track Line -->
    <line x1="-500" y1="500" x2="2000" y2="500" stroke="url(#metal-edge)" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Panel 1 (Top Louver) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -150,0; 0,0" dur="12s" repeatCount="indefinite" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" />
      <!-- Glass Panel -->
      <rect x="0" y="0" width="180" height="1500" fill="url(#panel-glass)" stroke="url(#metal-edge)" stroke-width="1" />
      
      <!-- Animated Edge Glow (Base) -->
      <rect x="0" y="0" width="4" height="1500" fill="#00f0ff" opacity="0.2" filter="url(#neon-glow)" />
      <!-- NEW: The Passing Laser Gradient on the Edge -->
      <rect x="0" y="0" width="4" height="1500" fill="url(#passing-laser-1)" filter="url(#neon-glow)" />
    </g>

    <!-- Panel 2 (Middle Sliding Roof) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="220,0; 40,0; 220,0" dur="12s" repeatCount="indefinite" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" />
      <!-- Glass Panel -->
      <rect x="0" y="0" width="180" height="1500" fill="url(#panel-glass)" stroke="url(#metal-edge)" stroke-width="1" />
      
      <!-- Animated Edge Glow (Base) -->
      <rect x="0" y="0" width="4" height="1500" fill="#3b82f6" opacity="0.2" filter="url(#neon-glow)" />
      <!-- NEW: The Passing Laser Gradient on the Edge -->
      <rect x="0" y="0" width="4" height="1500" fill="url(#passing-laser-2)" filter="url(#neon-glow)" />
    </g>

    <!-- Panel 3 (Bottom Telescoping Shade) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="440,0; 230,0; 440,0" dur="12s" repeatCount="indefinite" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" calcMode="spline" />
      <!-- Glass Panel -->
      <rect x="0" y="0" width="180" height="1500" fill="url(#panel-glass)" stroke="url(#metal-edge)" stroke-width="1" />
      
      <!-- Animated Edge Glow (Base) -->
      <rect x="0" y="0" width="4" height="1500" fill="#8b5cf6" opacity="0.2" filter="url(#neon-glow)" />
      <!-- NEW: The Passing Laser Gradient on the Edge -->
      <rect x="0" y="0" width="4" height="1500" fill="url(#passing-laser-3)" filter="url(#neon-glow)" />
    </g>

  </g>

  <!-- 4. Foreground Vignette (Darkens edges to make white text pop) -->
  <rect width="100%" height="100%" fill="none" stroke="#050608" stroke-width="150" opacity="0.5" filter="blur(50px)" />
</svg>
